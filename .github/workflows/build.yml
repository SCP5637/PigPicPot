name: Build and Release PigPicPot

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'src/main/PigPicPot.csproj'
  OUTPUT_DIR: 'Release'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}
      
    - name: Build and publish
      run: |
        # 清理之前的构建输出
        if (Test-Path "Release") { Remove-Item -Recurse -Force "Release" }
        if (Test-Path "Build") { Remove-Item -Recurse -Force "Build" }
        
        # 构建项目
        dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true /p:EnableCompressionInSingleFile=true
        
        # 复制到Release目录（使用正确的发布目录路径）
        $sourceDir = "src\main\Build\bin\Release\net8.0-windows\win-x64\publish"
        if (Test-Path $sourceDir) {
            New-Item -ItemType Directory -Path "Release" -Force
            Copy-Item "$sourceDir\*" "Release\" -Recurse -Force
        } else {
            # 如果上述路径不存在，尝试备用路径
            $altSourceDir = "src\main\bin\Release\net8.0-windows\win-x64\publish"
            if (Test-Path $altSourceDir) {
                New-Item -ItemType Directory -Path "Release" -Force
                Copy-Item "$altSourceDir\*" "Release\" -Recurse -Force
            } else {
                echo "ERROR: No publish directory found!"
                echo "Checked paths:"
                echo "  - $sourceDir"
                echo "  - $altSourceDir"
                exit 1
            }
        }
        
    - name: Read version from file
      id: version
      run: |
        $version = Get-Content "version.txt" -Raw
        $version = $version.Trim()
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Read version: $version"
        
    - name: Rename executable with version, run number and timestamp
      run: |
        $originalExe = "Release\PigPicPot.exe"
        if (Test-Path $originalExe) {
            $version = "${{ steps.version.outputs.version }}"
            $runNumber = $env:GITHUB_RUN_NUMBER
            $timestamp = Get-Date -Format "yyyyMMddHHmmss"
            $newName = "PigPicPot-$version-action$runNumber-$timestamp.exe"
            Rename-Item $originalExe "Release\$newName"
            echo "Renamed executable to: $newName"
        } else {
            echo "ERROR: Original executable not found at $originalExe"
            Get-ChildItem "Release" -Recurse | ForEach-Object { echo $_.FullName }
            exit 1
        }
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PigPicPot-Build-${{ github.run_number }}-${{ github.run_id }}
        path: Release/
        retention-days: 30
        
    - name: Display build info
      run: |
        echo "Build completed successfully!"
        echo "Run Number: ${{ github.run_number }}"
        echo "Run ID: ${{ github.run_id }}"
        echo "Commit: ${{ github.sha }}"
        Get-ChildItem "Release" -Recurse | ForEach-Object { echo "Artifact: $($_.Name)" }